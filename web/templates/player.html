<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - Toybox</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="player-body">
  <div class="player-container">
    <header class="player-header">
      <a href="../" class="back-link">&larr; Back to list</a>
      <h1 class="player-title">{{.Title}}</h1>
      {{if .Description}}
      <p class="player-desc">{{.Description}}</p>
      {{end}}
    </header>

    <main class="player-main">
      <iframe src="./game.html" class="game-frame" width="640" height="480" allow="autoplay"></iframe>
    </main>
  </div>
</body>
</html>
